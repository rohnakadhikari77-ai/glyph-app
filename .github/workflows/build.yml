          package com.glyphcallart

          import kotlin.math.sin
          import kotlin.random.Random

          object Leds {
              const val A = 11
              const val B = 5
              const val C = 20
              const val A0 = 0
              const val B0 = 11
              const val C0 = 16
              const val TOTAL = 36

              private const val A_START = -14f
              private const val A_SPAN = 44f
              private const val B_START = 133f
              private const val B_SPAN = 18f
              private const val C_START = 197f
              private const val C_SPAN = 43f

              private fun n360(a: Float): Float = ((a % 360f) + 360f) % 360f

              fun orbitAngle(t: Float): Float {
                  val starts = floatArrayOf(
                      C_START, C_START + C_SPAN, A_START, A_START + A_SPAN, B_START, B_START + B_SPAN
                  )
                  val lens = floatArrayOf(
                      C_SPAN, n360(A_START - (C_START + C_SPAN)), A_SPAN,
                      n360(B_START - (A_START + A_SPAN)), B_SPAN, n360(C_START - (B_START + B_SPAN))
                  )
                  val weights = floatArrayOf(1f, 0.15f, 1f, 0.15f, 1f, 0.15f)
                  var total = 0f
                  for (i in 0 until 6) total += lens[i] * weights[i]
                  var rem = t * total
                  for (i in 0 until 6) {
                      val span = lens[i] * weights[i]
                      if (rem <= span) return starts[i] + rem / weights[i]
                      rem -= span
                  }
                  return starts[0]
              }

              fun angle(id: Int): Float = when {
                  id < B0 -> A_START + (id - A0 + 0.5f) * A_SPAN / A
                  id < C0 -> B_START + (id - B0 + 0.5f) * B_SPAN / B
                  else -> C_START + (id - C0 + 0.5f) * C_SPAN / C
              }

              fun step(id: Int): Float = when {
                  id < B0 -> A_SPAN / A
                  id < C0 -> B_SPAN / B
                  else -> C_SPAN / C
              }
          }

          enum class Pattern(val title: String, val desc: String) {
              MIX("Mix", "Sab auto badalte hain"),
              ORBIT("Orbit", "Ek dot gol ghumta hai"),
              TWIN("Twin orbit", "Do dot ulte ghumte hain"),
              COMET("Comet", "Lambi poonch wali light"),
              MATRIX("Matrix", "Digital code streams girti hain"),
              RADAR("Radar", "360° sonar sweep + target blip"),
              LIGHTNING("Lightning", "Bijli jaisi tez multi-flash"),
              PENDULUM("Pendulum", "Smooth ghadi jaisa swing"),
              BOUNCE("Bounce", "Teeno zones mein tez ball"),
              SUPERNOVA("Supernova", "Charge hokar star blast"),
              VOICE("Voice bars", "Awaaz jaisi bars"),
              HEARTBEAT("Heartbeat", "Dhak-dhak dhadkan"),
              WAVE("Wave", "Lehar teeno zone mein"),
              FILL("Loader", "Teeno zone bharte-khaali"),
              SPARKLE("Sparkle", "Random chamak"),
              PULSE("Pulse", "Saans leti lights"),
              RAIN("Rain", "Boonden girti hain zones pe"),
              DNA("DNA", "Do strands twist karte hain"),
              RING("Ring", "Circle expand-contract"),
              FIRE("Fire", "Aag jaisi flicker"),
              VISUALIZER("Visualizer", "Bass / Beats / Vocal progressive"),
              ZONES("Zone test", "A, B, C ek-ek karke")
          }

          class Frame(val lit: IntArray, val delayMs: Long, val breathe: Boolean = false)

          class PatternEngine {
              private var step = 0
              private var levelA = 6
              private var levelB = 3
              private var levelC = 10
              private var mixElapsed = 0L
              private var mixIndex = 0

              fun reset() {
                  step = 0
                  mixElapsed = 0L
                  mixIndex = 0
              }

              fun next(pattern: Pattern): Frame {
                  if (pattern == Pattern.MIX) {
                      val f = next(MIX_LIST[mixIndex])
                      mixElapsed += f.delayMs
                      if (mixElapsed >= 4500L) {
                          mixElapsed = 0L
                          mixIndex = (mixIndex + 1) % MIX_LIST.size
                          step = 0
                      }
                      return f
                  }
                  val s = step
                  step++
                  return when (pattern) {
                      Pattern.ORBIT -> {
                          val phi = Leds.orbitAngle((s % ORBIT_STEPS).toFloat() / ORBIT_STEPS)
                          Frame(beam(phi - 3f, phi + 3f), 40L)
                      }
                      Pattern.TWIN -> {
                          val t = (s % ORBIT_STEPS).toFloat() / ORBIT_STEPS
                          val p1 = Leds.orbitAngle(t)
                          val p2 = Leds.orbitAngle((t + 0.5f) % 1f)
                          Frame(beam(p1 - 3f, p1 + 3f) + beam(p2 - 3f, p2 + 3f), 40L)
                      }
                      Pattern.COMET -> {
                          val phi = Leds.orbitAngle((s % ORBIT_STEPS).toFloat() / ORBIT_STEPS)
                          Frame(beam(phi - 45f, phi + 2f), 40L)
                      }
                      Pattern.MATRIX -> {
                          val l = LinkedHashSet<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val drop1 = (s + base * 2) % (n + 4)
                              val drop2 = (s + base + n / 2) % (n + 5)
                              for (d in intArrayOf(drop1, drop2)) {
                                  if (d < n) l.add(base + d)
                                  if (d - 1 in 0 until n) l.add(base + d - 1)
                                  if (d - 2 in 0 until n && s % 2 == 0) l.add(base + d - 2)
                              }
                          }
                          Frame(l.toIntArray(), 55L)
                      }
                      Pattern.RADAR -> {
                          val t = (s % ORBIT_STEPS).toFloat() / ORBIT_STEPS
                          val sweep = Leds.orbitAngle(t)
                          val blipAngle = Leds.orbitAngle(0.65f)
                          val sweepLeds = beam(sweep - 18f, sweep + 2f).toMutableSet()
                          if (norm(sweep - blipAngle) < 60f) {
                              sweepLeds.addAll(beam(blipAngle - 4f, blipAngle + 4f).toList())
                          }
                          Frame(sweepLeds.toIntArray(), 42L)
                      }
                      Pattern.LIGHTNING -> {
                          when (s % 12) {
                              0 -> Frame(IntArray(Leds.C) { Leds.C0 + it }, 45L)
                              1 -> Frame(IntArray(0), 35L)
                              2 -> Frame(ALL, 65L)
                              3 -> Frame(IntArray(Leds.A + Leds.B) { it }, 40L)
                              4 -> Frame(ALL, 50L)
                              5, 6 -> Frame(IntArray(Leds.B) { Leds.B0 + it }, 60L)
                              else -> Frame(IntArray(0), 110L)
                          }
                      }
                      Pattern.PENDULUM -> {
                          val rad = (s % 40) * (Math.PI * 2.0 / 40.0)
                          val f = ((sin(rad) + 1.0) / 2.0).toFloat()
                          val l = LinkedHashSet<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val center = idx(f, n)
                              l.add(base + center)
                              if (center > 0) l.add(base + center - 1)
                              if (center < n - 1) l.add(base + center + 1)
                          }
                          Frame(l.toIntArray(), 45L)
                      }
                      Pattern.BOUNCE -> {
                          val f = pingPong(s, 12)
                          val l = LinkedHashSet<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val i = idx(f, n)
                              l.add(base + i)
                              if ((i == 0 || i == n - 1) && n > 2) {
                                  val neighbor = if (i == 0) 1 else n - 2
                                  l.add(base + neighbor)
                              }
                          }
                          Frame(l.toIntArray(), 38L)
                      }
                      Pattern.SUPERNOVA -> {
                          val phase = s % 20
                          val l = ArrayList<Int>()
                          when {
                              phase < 10 -> {
                                  val spread = phase.toFloat() / 10f
                                  for ((base, n) in ZONE_DEFS) {
                                      val mid = n / 2
                                      val span = (spread * (n / 2)).toInt()
                                      for (i in (mid - span)..(mid + span)) {
                                          if (i in 0 until n) l.add(base + i)
                                      }
                                  }
                                  Frame(l.toIntArray(), 55L)
                              }
                              phase in 10..12 -> Frame(ALL, 65L)
                              phase == 13 -> Frame(IntArray(0), 50L)
                              phase == 14 -> Frame(ALL, 80L)
                              else -> Frame(IntArray(0), 90L)
                          }
                      }
                      Pattern.VOICE -> {
                          levelA = (levelA + Random.nextInt(-3, 4)).coerceIn(1, Leds.A)
                          levelB = (levelB + Random.nextInt(-1, 2)).coerceIn(1, Leds.B)
                          levelC = (levelC + Random.nextInt(-5, 6)).coerceIn(1, Leds.C)
                          val lit = IntArray(levelA + levelB + levelC)
                          var k = 0
                          for (i in 0 until levelA) lit[k++] = Leds.A0 + Leds.A - 1 - i
                          for (i in 0 until levelB) lit[k++] = Leds.B0 + i
                          for (i in 0 until levelC) lit[k++] = Leds.C0 + i
                          Frame(lit, 110L)
                      }
                      Pattern.HEARTBEAT -> when (s % 4) {
                          0, 2 -> Frame(ALL, 130L)
                          1 -> Frame(IntArray(0), 100L)
                          else -> Frame(IntArray(0), 750L)
                      }
                      Pattern.WAVE -> {
                          val f = pingPong(s, 20)
                          val l = LinkedHashSet<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val i = idx(f, n)
                              l.add(base + i)
                              if (i > 0) l.add(base + i - 1)
                          }
                          Frame(l.toIntArray(), 55L)
                      }
                      Pattern.FILL -> {
                          val g = pingPong(s, 24)
                          val l = ArrayList<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val c = ((g * n).toInt() + 1).coerceIn(1, n)
                              for (i in 0 until c) l.add(base + i)
                          }
                          Frame(l.toIntArray(), 55L)
                      }
                      Pattern.SPARKLE -> {
                          val l = ArrayList<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val want = if (n == Leds.B) 2 else if (n == Leds.A) 3 else 5
                              val pick = HashSet<Int>()
                              while (pick.size < want) pick.add(Random.nextInt(n))
                              for (p in pick) l.add(base + p)
                          }
                          Frame(l.toIntArray(), 130L)
                      }
                      Pattern.PULSE -> Frame(ALL, 1500L, true)
                      Pattern.RAIN -> {
                          val l = ArrayList<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val pos = (s + base) % (n + 3)
                              if (pos < n) l.add(base + pos)
                              if (pos > 0 && pos - 1 < n) l.add(base + pos - 1)
                          }
                          Frame(l.toIntArray(), 70L)
                      }
                      Pattern.DNA -> {
                          val t = (s % ORBIT_STEPS).toFloat() / ORBIT_STEPS
                          val p1 = Leds.orbitAngle(t)
                          val p2 = Leds.orbitAngle((1f - t) % 1f)
                          val trail = 8f
                          Frame(
                              beam(p1 - trail, p1 + 2f) + beam(p2 - trail, p2 + 2f),
                              45L
                          )
                      }
                      Pattern.RING -> {
                          val phase = pingPong(s, 18)
                          val width = 6f + phase * 28f
                          val center = 180f
                          Frame(beam(center - width / 2f, center + width / 2f), 50L)
                      }
                      Pattern.FIRE -> {
                          val l = ArrayList<Int>()
                          for ((base, n) in ZONE_DEFS) {
                              val height = Random.nextInt(1, (n * 0.7f).toInt().coerceAtLeast(2) + 1)
                              for (i in 0 until height) {
                                  val idx = if (base == Leds.A0) n - 1 - i else i
                                  if (Random.nextFloat() > 0.25f) l.add(base + idx)
                              }
                          }
                          Frame(l.toIntArray(), 90L)
                      }
                      Pattern.VISUALIZER -> Frame(IntArray(0), 50L)
                      Pattern.ZONES -> {
                          val (base, n) = ZONE_DEFS[s % 3]
                          Frame(IntArray(n) { base + it }, 1800L)
                      }
                      Pattern.MIX -> Frame(IntArray(0), 100L)
                  }
              }

              private fun pingPong(s: Int, period: Int): Float {
                  val p = s % (2 * period)
                  val k = if (p <= period) p else 2 * period - p
                  return k.toFloat() / period
              }

              private fun idx(f: Float, n: Int): Int = (f * n).toInt().coerceIn(0, n - 1)

              private fun norm(a: Float): Float = ((a % 360f) + 360f) % 360f

              private fun beam(from: Float, to: Float): IntArray {
                  val len = norm(to - from)
                  val l = ArrayList<Int>()
                  for (id in 0 until Leds.TOTAL) {
                      if (norm(Leds.angle(id) - from) <= len) l.add(id)
                  }
                  return l.toIntArray()
              }

              companion object {
                  private const val ORBIT_STEPS = 48
                  private val ALL = IntArray(Leds.TOTAL) { it }
                  private val ZONE_DEFS = listOf(
                      Pair(Leds.A0, Leds.A),
                      Pair(Leds.B0, Leds.B),
                      Pair(Leds.C0, Leds.C)
                  )
                  private val MIX_LIST = listOf(
                      Pattern.ORBIT, Pattern.TWIN, Pattern.COMET, Pattern.MATRIX,
                      Pattern.RADAR, Pattern.LIGHTNING, Pattern.PENDULUM, Pattern.BOUNCE,
                      Pattern.SUPERNOVA, Pattern.VOICE, Pattern.HEARTBEAT, Pattern.WAVE,
                      Pattern.FILL, Pattern.SPARKLE, Pattern.RAIN, Pattern.DNA,
                      Pattern.RING, Pattern.FIRE
                  )
              }
          }
