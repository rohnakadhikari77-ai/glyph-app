          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var scroll: ScrollView
              private lateinit var preview: GlyphPreviewView
              private lateinit var nowPlaying: TextView
              private lateinit var statusView: TextView
              private lateinit var testButton: TextView
              private lateinit var watchButton: TextView
              private var controller: GlyphController? = null
              private var selected = Pattern.ORBIT

              private val cards = ArrayList<Pair<Pattern, LinearLayout>>()
              private val checks = ArrayList<Pair<TextView, () -> Boolean>>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT

                  prefs = getSharedPreferences("glyph", MODE_PRIVATE)
                  selected = loadPattern()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), dp(24), dp(20), dp(40))

                  scroll = ScrollView(this)
                  scroll.background = liquidBackground()
                  scroll.isVerticalScrollBarEnabled = false
                  scroll.addView(col)
                  scroll.setOnApplyWindowInsetsListener { v, insets ->
                      val bars = insets.getInsets(WindowInsets.Type.systemBars())
                      v.setPadding(0, bars.top, 0, bars.bottom)
                      insets
                  }

                  val badge = label("✦  NOTHING OS • LIQUID GLASS", 10f, GLASS_HIGHLIGHT, bold = true, mono = true)
                  badge.letterSpacing = 0.14f
                  badge.setPadding(dp(12), dp(6), dp(12), dp(6))
                  badge.background = glassSurface(GLASS_TOP, GLASS_BOT, 50, GLASS_BORDER_BRIGHT, 1)
                  val badgeWrap = LinearLayout(this)
                  badgeWrap.addView(badge, lp(WRAP, WRAP))
                  col.addView(badgeWrap, lp(MATCH, WRAP, b = 10))

                  val title = label("Glyph Call Art", 28f, TEXT, bold = true)
                  title.letterSpacing = 0.02f
                  col.addView(title)
                  col.addView(label("Call aane par piche ki light mein liquid art", 14f, MUTED), lp(MATCH, WRAP, t = 4))

                  val previewCard = LinearLayout(this)
                  previewCard.orientation = LinearLayout.VERTICAL
                  previewCard.gravity = Gravity.CENTER_HORIZONTAL
                  previewCard.setPadding(dp(14), dp(14), dp(14), dp(16))
                  previewCard.background = glassSurface(GLASS_SHOWCASE_TOP, GLASS_SHOWCASE_BOT, 28, GLASS_BORDER_BRIGHT, 1)
                  previewCard.elevation = dp(10).toFloat()

                  preview = GlyphPreviewView(this)
                  preview.background = glassSurface(Color.parseColor("#6605070F"), Color.parseColor("#9905070F"), 22, GLASS_BORDER, 1)
                  preview.setPattern(selected)
                  previewCard.addView(preview, lp(MATCH, dp(220)))

                  nowPlaying = label("", 12f, Color.WHITE, bold = true, mono = true)
                  nowPlaying.gravity = Gravity.CENTER
                  nowPlaying.letterSpacing = 0.12f
                  nowPlaying.setPadding(dp(16), dp(6), dp(16), dp(6))
                  nowPlaying.background = glassSurface(ACCENT_TOP, ACCENT_BOT, 40, ACCENT_BORDER, 1)
                  previewCard.addView(nowPlaying, lp(WRAP, WRAP, t = 12))

                  val note = label("A = right arc  •  B = neeche-left  •  C = upar-left", 11f, MUTED)
                  note.gravity = Gravity.CENTER
                  previewCard.addView(note, lp(MATCH, WRAP, t = 8))

                  col.addView(previewCard, lp(MATCH, WRAP, t = 18))

                  col.addView(sectionTitle("PATTERN CHUNO"))
                  val all = Pattern.values()
                  var i = 0
                  while (i < all.size) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      for (j in 0..1) {
                          if (i + j < all.size) {
                              row.addView(
                                  card(all[i + j]),
                                  lp(0, WRAP, l = if (j == 1) 6 else 0, r = if (j == 0) 6 else 0, b = 12, weight = 1f)
                              )
                          } else {
                              row.addView(View(this), lp(0, 1, weight = 1f))
                          }
                      }
                      col.addView(row, lp(MATCH, WRAP))
                      i += 2
                  }
                  select(selected)

                  col.addView(sectionTitle("LIVE TEST"))
                  testButton = pill("Glyph pe test karo", true) {
                      if (controller == null) startTest() else stopTest()
                  }
                  col.addView(testButton, lp(MATCH, WRAP))

                  col.addView(sectionTitle("CALL PAR AUTO CHALAO"))
                  col.addView(
                      stepRow(
                          "1", "Permissions", "Phone state + notification + mic (Visualizer ke liye)",
                          {
                              granted(Manifest.permission.READ_PHONE_STATE) &&
                                  granted(Manifest.permission.POST_NOTIFICATIONS) &&
                                  granted(Manifest.permission.RECORD_AUDIO)
                          }
                      ) {
                          requestPermissions(
                              arrayOf(
                                  Manifest.permission.READ_PHONE_STATE,
                                  Manifest.permission.POST_NOTIFICATIONS,
                                  Manifest.permission.RECORD_AUDIO
                              ),
                              REQ_PERMS
                          )
                      },
                      lp(MATCH, WRAP, b = 10)
                  )
                  col.addView(
                      stepRow(
                          "2", "Overlay permission", "Call aane par app apne aap khulne ke liye",
                          { Settings.canDrawOverlays(this) }
                      ) {
                          startActivity(
                              Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          )
                      },
                      lp(MATCH, WRAP, b = 10)
                  )
                  watchButton = pill("Call watcher chalu karo", true) { toggleWatcher() }
                  col.addView(watchButton, lp(MATCH, WRAP, t = 4))

                  col.addView(sectionTitle("AGAR GLYPH NA CHALE"))
                  val dbg = LinearLayout(this)
                  dbg.orientation = LinearLayout.VERTICAL
                  dbg.setPadding(dp(18), dp(16), dp(18), dp(16))
                  dbg.background = glassSurface(GLASS_TOP, GLASS_BOT, 22, GLASS_BORDER, 1)
                  dbg.addView(label("Zyadatar phones pe iski zaroorat nahi padti. Test mein light na jale toh ye command chalao (Shizuku shell ya adb se, 48 ghante tak chalti hai):", 13f, MUTED))
                  val cmdBox = label(DEBUG_CMD, 12f, GLASS_HIGHLIGHT, mono = true)
                  cmdBox.setPadding(dp(12), dp(10), dp(12), dp(10))
                  cmdBox.background = glassSurface(Color.parseColor("#55000000"), Color.parseColor("#77000000"), 14, GLASS_BORDER, 1)
                  dbg.addView(cmdBox, lp(MATCH, WRAP, t = 10))
                  col.addView(dbg, lp(MATCH, WRAP))

                  col.addView(pill("Command copy karo", false) {
                      val cm = getSystemService(ClipboardManager::class.java)
                      cm.setPrimaryClip(ClipData.newPlainText("glyph", DEBUG_CMD))
                      setStatus("Command copy ho gayi ✓")
                  }, lp(MATCH, WRAP, t = 10))

                  statusView = label("", 13f, GLASS_HIGHLIGHT)
                  statusView.gravity = Gravity.CENTER
                  col.addView(statusView, lp(MATCH, WRAP, t = 18))

                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  preview.start()
                  refresh()
              }

              override fun onPause() {
                  stopTest()
                  preview.stop()
                  super.onPause()
              }

              private fun select(p: Pattern) {
                  selected = p
                  prefs.edit().putString("pattern", p.name).apply()
                  preview.setPattern(p)
                  nowPlaying.text = "●  ${p.title.uppercase()}"
                  controller?.setPattern(p)
                  for ((pat, card) in cards) {
                      if (pat == p) {
                          card.background = glassSurface(GLASS_SELECTED_TOP, GLASS_SELECTED_BOT, 22, ACCENT_BORDER, 2)
                          card.elevation = dp(8).toFloat()
                      } else {
                          card.background = glassSurface(GLASS_TOP, GLASS_BOT, 22, GLASS_BORDER, 1)
                          card.elevation = dp(2).toFloat()
                      }
                  }
              }

              private fun startTest() {
                  if (selected == Pattern.VISUALIZER && !granted(Manifest.permission.RECORD_AUDIO)) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_PERMS)
                      setStatus("Visualizer ke liye mic permission do, phir dubara test dabao")
                      return
                  }
                  val c = GlyphController(this) { msg -> setStatus(msg) }
                  controller = c
                  c.start(selected)
                  testButton.text = "Test roko"
                  stylePill(testButton, false)
              }

              private fun stopTest() {
                  controller?.stop()
                  controller = null
                  if (::testButton.isInitialized) {
                      testButton.text = "Glyph pe test karo"
                      stylePill(testButton, true)
                  }
              }

              private fun toggleWatcher() {
                  if (watcherRunning()) {
                      stopService(Intent(this, CallWatcherService::class.java))
                      setStatus("Call watcher band")
                  } else {
                      if (!granted(Manifest.permission.READ_PHONE_STATE)) {
                          setStatus("Pehle step 1 mein permissions do")
                          return
                      }
                      startForegroundService(Intent(this, CallWatcherService::class.java))
                      setStatus("Call watcher chalu. Ab kisi ko call karo.")
                  }
                  scroll.postDelayed({ refresh() }, 500)
              }

              @Suppress("DEPRECATION")
              private fun watcherRunning(): Boolean {
                  val am = getSystemService(ActivityManager::class.java)
                  return am.getRunningServices(50).any { it.service.className == CallWatcherService::class.java.name }
              }

              private fun granted(perm: String) = checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED

              private fun refresh() {
                  for ((view, done) in checks) {
                      if (done()) {
                          view.text = "✓ Ho gaya"
                          view.setTextColor(GREEN)
                          view.background = glassSurface(Color.parseColor("#3320C997"), Color.parseColor("#1820C997"), 30, GREEN, 1)
                      } else {
                          view.text = "Karo →"
                          view.setTextColor(Color.WHITE)
                          view.background = glassSurface(ACCENT_TOP, ACCENT_BOT, 30, ACCENT_BORDER, 1)
                      }
                  }
                  if (watcherRunning()) {
                      watchButton.text = "Call watcher band karo"
                      stylePill(watchButton, false)
                  } else {
                      watchButton.text = "Call watcher chalu karo"
                      stylePill(watchButton, true)
                  }
              }

              private fun setStatus(msg: String) {
                  runOnUiThread {
                      if (::statusView.isInitialized) statusView.text = msg
                  }
              }

              private fun loadPattern(): Pattern {
                  val saved = prefs.getString("pattern", Pattern.ORBIT.name)
                  return Pattern.values().firstOrNull { it.name == saved } ?: Pattern.ORBIT
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun lp(
                  w: Int, h: Int,
                  l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0,
                  weight: Float = 0f
              ): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h, weight)
                  p.setMargins(dp(l), dp(t), dp(r), dp(b))
                  return p
              }

              private fun liquidBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(BG_TOP, BG_MID, BG_BOT)
                  )
              }

              private fun glassSurface(
                  topColor: Int,
                  botColor: Int,
                  radiusDp: Int,
                  strokeColor: Int = 0,
                  strokeDp: Int = 0
              ): GradientDrawable {
                  val g = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(topColor, botColor)
                  )
                  g.cornerRadius = dp(radiusDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dp(strokeDp), strokeColor)
                  return g
              }

              private fun label(
                  s: String, sp: Float, color: Int,
                  bold: Boolean = false, mono: Boolean = false
              ): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = sp
                  t.setTextColor(color)
                  t.typeface = if (mono) Typeface.MONOSPACE else Typeface.DEFAULT
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  return t
              }

              private fun sectionTitle(s: String): TextView {
                  val t = label(s, 11f, GLASS_HIGHLIGHT, bold = true, mono = true)
                  t.letterSpacing = 0.18f
                  t.layoutParams = lp(MATCH, WRAP, t = 28, b = 12)
                  return t
              }

              private fun stylePill(t: TextView, primary: Boolean) {
                  t.setTextColor(if (primary) Color.WHITE else TEXT)
                  t.background = if (primary) {
                      glassSurface(ACCENT_TOP, ACCENT_BOT, 30, ACCENT_BORDER, 1)
                  } else {
                      glassSurface(GLASS_TOP, GLASS_BOT, 30, GLASS_BORDER_BRIGHT, 1)
                  }
                  t.elevation = if (primary) dp(6).toFloat() else dp(2).toFloat()
              }

              private fun pill(s: String, primary: Boolean, onClick: () -> Unit): TextView {
                  val t = label(s, 15f, TEXT, bold = true)
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(18), dp(15), dp(18), dp(15))
                  stylePill(t, primary)
                  t.isClickable = true
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun card(p: Pattern): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(16), dp(15), dp(16), dp(15))
                  c.addView(label(p.title, 15f, TEXT, bold = true))
                  val d = label(p.desc, 12f, MUTED)
                  d.minLines = 2
                  d.maxLines = 2
                  c.addView(d, lp(MATCH, WRAP, t = 4))
                  c.isClickable = true
                  c.setOnClickListener { select(p) }
                  cards.add(Pair(p, c))
                  return c
              }

              private fun stepRow(
                  num: String, title: String, sub: String,
                  done: () -> Boolean, onClick: () -> Unit
              ): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(dp(16), dp(15), dp(16), dp(15))
                  row.background = glassSurface(GLASS_TOP, GLASS_BOT, 22, GLASS_BORDER, 1)

                  val n = label(num, 15f, Color.WHITE, bold = true, mono = true)
                  n.gravity = Gravity.CENTER
                  n.background = glassSurface(ACCENT_TOP, ACCENT_BOT, 50, ACCENT_BORDER, 1)
                  row.addView(n, lp(dp(32), dp(32), r = 12))

                  val texts = LinearLayout(this)
                  texts.orientation = LinearLayout.VERTICAL
                  texts.addView(label(title, 15f, TEXT, bold = true))
                  texts.addView(label(sub, 12f, MUTED), lp(MATCH, WRAP, t = 2))
                  row.addView(texts, lp(0, WRAP, weight = 1f))

                  val status = label("", 12f, Color.WHITE, bold = true)
                  status.setPadding(dp(12), dp(6), dp(12), dp(6))
                  row.addView(status, lp(WRAP, WRAP, l = 8))
                  checks.add(Pair(status, done))

                  row.isClickable = true
                  row.setOnClickListener { onClick() }
                  return row
              }

              companion object {
                  private const val REQ_PERMS = 10
                  private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
                  private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
                  private const val DEBUG_CMD = "settings put global nt_glyph_interface_debug_enable 1"

                  private val BG_TOP = Color.parseColor("#080B1A")
                  private val BG_MID = Color.parseColor("#11172E")
                  private val BG_BOT = Color.parseColor("#180D24")

                  private val GLASS_SHOWCASE_TOP = Color.parseColor("#38FFFFFF")
                  private val GLASS_SHOWCASE_BOT = Color.parseColor("#14FFFFFF")

                  private val GLASS_TOP = Color.parseColor("#38FFFFFF")
                  private val GLASS_SHOWCASE_BOT = Color.parseColor("#14FFFFFF")

                  private val GLASS_TOP = Color.parseColor("#29FFFFFF")
                  private val GLASS_BOT = Color.parseColor("#0FFFFFFF")

                  private val GLASS_SELECTED_TOP = Color.parseColor("#4DFF2E54")
                  private val GLASS_SELECTED_BOT = Color.parseColor("#1FFF2E54")

                  private val GLASS_BORDER = Color.parseColor("#38FFFFFF")
                  private val GLASS_BORDER_BRIGHT = Color.parseColor("#66FFFFFF")
                  private val GLASS_HIGHLIGHT = Color.parseColor("#B8D4FF")

                  private val ACCENT_TOP = Color.parseColor("#F2FF2E54")
                  private val ACCENT_BOT = Color.parseColor("#D9D71921")
                  private val ACCENT_BORDER = Color.parseColor("#99FF8FA3")

                  private val TEXT = Color.parseColor("#F8FAFF")
                  private val MUTED = Color.parseColor("#A6B0C8")
                  private val GREEN = Color.parseColor("#42F5A1")
              }
          }
          EOF

          git clone --depth 1 https://github.com/Nothing-Developer-Programme/Glyph-Developer-Kit.git "$RUNNER_TEMP/gdk"
          cp "$RUNNER_TEMP/gdk/sdk/glyph-matrix-sdk-2.0.aar" app/libs/
          test -f app/src/main/java/com/glyphcallart/Pattern.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GlyphCallArt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
